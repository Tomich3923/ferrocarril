<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferrocarril México-Veracruz 1877</title><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script crossorigin="anonymous" src="./external/xr/xr.js" async data-preload-chunks="slam"></script></head><body><script>const onxrloaded = async () => {
  // Cargar correctamente el JSON del image target
  const response = await fetch('./image-targets/Imagetarget2.json')
