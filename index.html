<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrocarril México-Veracruz 1877</title>

<script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>

<script
  crossorigin="anonymous"
  src="./external/xr/xr.js"
  async
  data-preload-chunks="image-target"
></script>

</head>

<body>

<script>
const onxrloaded = () => {
  XR8.XrController.configure({
    imageTargetData: [
      require('./image-targets/Imagetarget2.json')
    ],
  })
}

window.XR8
  ? onxrloaded()
  : window.addEventListener('xrloaded', onxrloaded)
</script>

<script src="bundle.js"></script>

</body>
</html>
